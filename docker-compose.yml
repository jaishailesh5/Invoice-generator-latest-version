services:
  invoice-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"  # Changed to port 3001 to avoid conflicts
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data
    volumes:
      # Windows path format for Docker
      - C:/Project/invoice-generator/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
